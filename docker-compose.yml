services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////app/data/agent_shield.db
      AGENTSHIELD_TOOL_SANDBOX: /app/tmp/tool-sandbox
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - agent_shield_data:/app/data
    tmpfs:
      - /app/tmp:uid=10001,gid=10001,mode=1770
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    cpus: 1.5
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5)"]
      interval: 10s
      timeout: 8s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
        VITE_AGENTSHIELD_DEV_AUTH_TOKEN: ${VITE_AGENTSHIELD_DEV_AUTH_TOKEN:-}
    ports:
      - "127.0.0.1:3000:80"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /var/log/nginx
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

volumes:
  agent_shield_data:
