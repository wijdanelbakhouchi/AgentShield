[pytest]
markers =
    unit: isolated component tests
    integration: component/API/DB integration tests
    security: security boundary and policy tests
    e2e: end-to-end workflow tests
    provider: provider selection or fallback tests
    real_provider: opt-in tests requiring a live provider and credentials
    live: tests requiring an external network/provider runtime
    experiment: reproducibility and research-integrity tests
asyncio_default_fixture_loop_scope = function
